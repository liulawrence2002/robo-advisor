[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#0E6B52"
backgroundColor = "#F8F7F3"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#101418"
linkColor = "#0E6B52"
borderColor = "#E4E1D9"
dataframeBorderColor = "#E8E5DE"
dataframeHeaderBackgroundColor = "#F3F1EC"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "10px"
buttonRadius = "999px"
baseFontSize = 15
font = "'Instrument Sans':https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap"
headingFont = "'Instrument Serif':https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
